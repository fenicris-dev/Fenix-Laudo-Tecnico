<style>
:root{--navy:#041273;--navy2:#0a2199;--gold:#c9a227;--gold2:#e8c35a;--bg:#f6f4ee;--card:#fff;--tile:#e8eefb;--ink:#14172b;--mut:#5b6075;--line:#e3e1d8;--ok:#0f7b3d;--okbg:#dff3e6;--warn:#8a5a00;--warnbg:#fff0cc;--bad:#b3261e;--badbg:#fde4e1;--info:#1d4fd8;--infobg:#e2eaff;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;overscroll-behavior-y:none;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
#top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));background:var(--navy);color:#fff;border-bottom:3px solid var(--gold)}
#top b{flex:1;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#back{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:10px;width:38px;height:38px;font-size:20px;cursor:pointer}
#main{max-width:980px;margin:0 auto;padding:14px 14px 100px}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.badge.ok{background:var(--okbg);color:var(--ok)}.badge.off,.badge.warn{background:var(--warnbg);color:var(--warn)}.badge.info{background:var(--infobg);color:var(--info)}.badge.mut{background:#ececf1;color:var(--mut)}.badge.bad{background:var(--badbg);color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
h1{font-size:20px;margin:0;letter-spacing:.3px;color:var(--navy)}h2{font-size:17px;margin:18px 0 8px}h3{font-size:16px;margin:0}
.mut{color:var(--mut)}small{color:var(--mut);display:block;font-size:12px;margin-top:3px}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
@media(min-width:720px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--tile);border:1px solid transparent;border-radius:14px;padding:14px;text-align:left;cursor:pointer;color:var(--ink);text-decoration:none;display:block;font:inherit}
.tile:active{transform:scale(.98)}.tile:hover{border-color:var(--gold)}
.tile svg{width:26px;height:26px;stroke:var(--navy);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tile b{display:block;font-size:17px;margin-top:8px}.tile span{color:var(--mut);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{cursor:pointer;background:none;border:0;text-align:left;font:inherit;padding:0;color:var(--ink)}.stat b{display:block;font-size:32px;font-weight:700;line-height:1.1}.stat span{color:var(--mut);font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--navy);background:#fff;color:var(--navy);border-radius:12px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn.pri{background:var(--navy);color:#fff}.btn.gold{background:var(--gold);border-color:var(--gold);color:#1a1400}.btn.danger{border-color:var(--bad);color:var(--bad)}.btn.danger.pri{background:var(--bad);color:#fff}
.btn.sm{padding:6px 12px;font-size:14px;border-radius:10px}.btn:disabled{opacity:.45;cursor:not-allowed}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.grid2{display:grid;grid-template-columns:1fr;gap:10px}@media(min-width:620px){.grid2{grid-template-columns:1fr 1fr}}
.f{display:block}.f.full,.full{grid-column:1/-1}.f>span,.lb{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
input,select,textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid #cfd2dc;border-radius:10px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);border-color:var(--gold)}
input[type=checkbox]{width:auto}textarea{resize:vertical}
input:disabled,select:disabled,textarea:disabled{background:#f1f1f4;color:#444}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:14px;margin:4px 0;font-weight:400}.chk input{margin-top:4px}
.ov{position:fixed;inset:0;background:rgba(10,14,40,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;overscroll-behavior:contain}
@media(min-width:720px){.ov{align-items:center}}
.md{background:#fff;width:100%;max-width:760px;max-height:92vh;display:flex;flex-direction:column;border-radius:20px 20px 0 0;overflow:hidden}
@media(min-width:720px){.md{border-radius:20px}}.md.wide{max-width:900px}
.mh{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:#fafaf7}.mh h3{flex:1}
.mx{background:#eee;border:0;border-radius:10px;width:36px;height:36px;font-size:18px;cursor:pointer}
.mb{padding:16px;overflow:auto;overscroll-behavior:contain;flex:1}
.mf{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#14172b;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:80;opacity:0;pointer-events:none;transition:.25s;max-width:90vw}#toast.on{opacity:1}
.item{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}.item .t{font-weight:700}.item .s{color:var(--mut);font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;font:inherit;font-size:14px;cursor:pointer}.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.steps{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;margin-bottom:6px}.stp{flex:none;border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}.stp.on{background:var(--navy);color:#fff;border-color:var(--navy)}.stp.ok{border-color:var(--ok)}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px;padding-bottom:max(10px,env(safe-area-inset-bottom));z-index:15}.bar>div{max-width:980px;margin:0 auto;display:flex;gap:10px;align-items:center;justify-content:space-between}
.rc{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;background:#fcfcfa}.rc .grid2{gap:8px}
.x{background:none;border:0;color:var(--bad);font-size:18px;cursor:pointer;padding:4px 8px}
.alert{border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14px}.alert.warn{background:var(--warnbg);color:#5c3b00}.alert.info{background:var(--infobg);color:#10337f}.alert.bad{background:var(--badbg);color:#7a1610}.alert.ok{background:var(--okbg);color:#0a4f27}
.pend{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}.th{border:1px solid var(--line);border-radius:12px;padding:6px;background:#fff}.th img{width:100%;height:110px;object-fit:cover;border-radius:8px}
canvas.sg{width:100%;height:150px;border:1px dashed #9aa;border-radius:10px;background:#fff;touch-action:none}
.imgp{max-width:100%;max-height:90px;border:1px solid var(--line);border-radius:8px;padding:4px;background:#fff;display:block;margin:6px 0}
.lock .ed{display:none!important}
pre.pm{white-space:pre-wrap;font:12.5px/1.45 ui-monospace,Consolas,monospace;background:#f4f4f1;padding:10px;border-radius:10px;max-height:50vh;overflow:auto}
/* ===== documento ===== */
.doc{background:#fff;color:#111;font:10.5pt/1.45 "Segoe UI",Arial,sans-serif;max-width:210mm;margin:0 auto;padding:12mm;position:relative}
.doc .dh{display:flex;gap:14px;align-items:center;border-bottom:3px solid var(--navy);padding-bottom:10px;margin-bottom:12px}
.doc .dh img{max-height:64px;max-width:150px;object-fit:contain}
.doc .dh .e{flex:1}.doc .dh .e b{font-size:13pt;color:var(--navy)}.doc .dh .e div{font-size:9pt;color:#444}
.doc .dn{text-align:right;font-size:9pt}.doc .dn b{display:block;font-size:12pt;color:var(--navy)}
.doc h1{font-size:15pt;text-align:center;color:var(--navy);margin:8px 0 2px;text-transform:uppercase}
.doc .sub{text-align:center;font-size:9.5pt;color:#555;margin-bottom:10px}
.doc h2{font-size:10.5pt;color:#fff;background:var(--navy);padding:4px 8px;margin:14px 0 6px;border-radius:3px;break-after:avoid;text-transform:uppercase;letter-spacing:.3px}
.doc table{width:100%;border-collapse:collapse;margin:4px 0 8px;font-size:9.5pt}
.doc th,.doc td{border:1px solid #c9ccd6;padding:4px 6px;text-align:left;vertical-align:top}
.doc th{background:#eef1fa;font-weight:600}.doc table.kv th{width:32%}.doc tr{break-inside:avoid}
.doc .nd{color:#888;font-style:italic}
.doc .box{border:2px solid var(--gold);background:#fffbea;padding:8px 10px;border-radius:4px;margin:6px 0;break-inside:avoid}
.doc .note{font-size:9pt;color:#444;border-left:3px solid var(--gold);padding:3px 8px;margin:6px 0;background:#fafaf5}
.doc .figs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.doc figure{margin:0;break-inside:avoid;border:1px solid #ddd;padding:4px}.doc figure img{width:100%;max-height:70mm;object-fit:contain}.doc figcaption{font-size:8.5pt;color:#444;text-align:center}
.doc .sig{margin-top:22px;text-align:center;break-inside:avoid}.doc .sig img{max-height:60px}.doc .sig .ln{border-top:1px solid #000;width:280px;margin:2px auto 0;padding-top:3px}
.doc ul{margin:4px 0 6px 18px;padding:0}
.doc .wm{position:absolute;left:0;right:0;top:38%;text-align:center;font-size:30pt;font-weight:800;color:rgba(179,38,30,.13);transform:rotate(-24deg);pointer-events:none;line-height:1.1}
.doc .rasc{background:#fde4e1;color:#7a1610;text-align:center;font-weight:700;padding:4px;margin-bottom:8px;border-radius:4px;font-size:9.5pt}
.pf-head,.pf-foot{display:none}
#print-root{display:none}
@media print{
 html,body{background:#fff}
 body>*:not(#print-root){display:none!important}
 #print-root{display:block!important}
 @page{size:A4;margin:22mm 14mm 20mm;@bottom-right{content:"Página " counter(page) " de " counter(pages);font:8pt Arial;color:#555}}
 .doc{max-width:none;padding:0}
 .pf-head{display:block;position:fixed;top:-16mm;left:0;right:0;font-size:8pt;color:#555;border-bottom:1px solid #bbb;padding-bottom:2px}
 .pf-foot{display:block;position:fixed;bottom:-16mm;left:0;font-size:7.5pt;color:#555}
 .doc .wm{position:fixed;top:42%}
 .doc h2{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .doc th,.doc .box,.doc .rasc{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>

<script>
'use strict';
const VERSAO='1.0',APP='Fênix | Laudos Técnicos';
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const fmtData=i=>{if(!i)return'—';const d=/^\d{4}-\d{2}-\d{2}$/.test(i)?new Date(i+'T12:00:00'):new Date(i);return isNaN(d)?'—':d.toLocaleDateString('pt-BR')};

const slug=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'').slice(0,30);
const getP=(o,p)=>p.split('.').reduce((a,k)=>a==null?a:a[k],o);
function setP(o,p,v){const ks=p.split('.');let a=o;ks.slice(0,-1).forEach((k,i)=>{if(a[k]==null)a[k]=/^\d+$/.test(ks[i+1])?[]:{};a=a[k]});a[ks[ks.length-1]]=v}
const soNum=s=>String(s||'').replace(/\D/g,'');
function validarCNPJ(c){c=soNum(c);if(c.length!==14||/^(\d)\1+$/.test(c))return false;const f=n=>{let s=0,p=n-7;for(let i=0;i<n;i++){s+=+c[i]*p--;if(p<2)p=9}const r=s%11;return r<2?0:11-r};return f(12)===+c[12]&&f(13)===+c[13]}
function validarCPF(c){c=soNum(c);if(c.length!==11||/^(\d)\1+$/.test(c))return false;const f=n=>{let s=0;for(let i=0;i<n;i++)s+=+c[i]*(n+1-i);const r=(s*10)%11;return r===10?0:r};return f(9)===+c[9]&&f(10)===+c[10]}
function fmtDoc(d){d=soNum(d);if(d.length===11)return d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4');if(d.length===14)return d.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,'$1.$2.$3/$4-$5');return d}
const endStr=o=>[[o.logradouro,o.numero].filter(Boolean).join(', '),o.bairro,[o.cidade,o.uf].filter(Boolean).join('/'),o.cep?'CEP '+o.cep:''].filter(Boolean).join(' - ');

/* ===== dados fixos ===== */

const ST={rascunho:['Rascunho','warn'],revisao:['Em revisão','info'],definitivo:['Definitivo','ok'],arquivado:['Arquivado','mut']};
const AVAL=[['','—'],['conforme','Conforme'],['nao','Não conforme'],['sem','Sem critério (só registro)']];
const FONTES=['','Especificação do fabricante','Norma técnica','Critério técnico justificado'];
const REFS=[['nbr10719','ABNT NBR 10719 — Apresentação de relatórios técnicos e científicos'],['nr10','NR-10 — Segurança em instalações e serviços em eletricidade'],['nbr5410','ABNT NBR 5410 — Instalações elétricas de baixa tensão'],['nbr14039','ABNT NBR 14039 — Instalações elétricas de média tensão'],['cft055','Resolução CFT nº 055/2019'],['confea1137','Resolução CONFEA nº 1.137/2023 — ART e acervo técnico'],['trtman','Manual de geração de TRT — CFT']];
const refTxt=id=>(REFS.find(r=>r[0]===id)||[,id])[1];
const CATS=[
{id:'motores',nome:'Motores elétricos',desc:'Placa, potência, tensão, corrente, isolamento, funcionamento e condições mecânicas.',campos:[['rpm','Rotação nominal (rpm)'],['corrente','Corrente nominal (A)'],['fp','Fator de potência'],['ip','Grau de proteção (IP)'],['isolamento','Classe de isolamento'],['fases','Nº de fases / ligação'],['carcaca','Carcaça']],proc:['Inspeção visual da carcaça, tampas e caixa de ligação','Verificação de fixação e alinhamento','Verificação de rolamentos e giro livre do eixo (folga, ruído)','Inspeção de terminais e conexões','Medição de resistência ôhmica dos enrolamentos','Medição de resistência de isolamento','Medição de tensão de alimentação','Medição de corrente em operação','Teste funcional (partida e operação)','Verificação de aterramento, quando aplicável'],med:[['Tensão de alimentação','V'],['Corrente em operação','A'],['Resistência ôhmica dos enrolamentos','Ω'],['Resistência de isolamento','MΩ'],['Rotação','rpm'],['Temperatura da carcaça','°C']],refs:['nr10','nbr5410']},
{id:'quadros',nome:'Quadros elétricos',desc:'Disjuntores, barramentos, conexões, dimensionamento, identificação e proteção.',campos:[['tensaoBarr','Tensão do barramento (V)'],['corrBarr','Corrente nominal do barramento (A)'],['ipq','Grau de proteção (IP)'],['ncirc','Nº de circuitos'],['dps','Possui DPS? (sim/não)'],['dr','Possui DR? (sim/não)']],proc:['Inspeção visual geral (corrosão, aquecimento, sujidade)','Verificação de identificação de circuitos e diagrama','Inspeção de disjuntores e dispositivos de proteção','Verificação de barramentos e conexões (aperto, descoloração)','Verificação de dimensionamento de condutores e proteções','Medição de tensão (fase-fase / fase-neutro)','Medição de corrente por circuito','Verificação de aterramento e equipotencialização','Teste de dispositivo DR, quando existente','Termografia, quando disponível'],med:[['Tensão fase-neutro','V'],['Tensão fase-fase','V'],['Corrente por circuito','A'],['Resistência de aterramento','Ω'],['Corrente de fuga','mA'],['Temperatura de conexões','°C']],refs:['nr10','nbr5410']},
{id:'eletronicos',nome:'Equipamentos eletrônicos',desc:'Fontes, placas, componentes, circuitos, alimentação e diagnóstico.',campos:[['tipoAlim','Tipo de alimentação (CA/CC/bateria)'],['fonte','Fonte / saída nominal'],['placa','Referência da placa'],['firmware','Firmware / versão']],proc:['Inspeção visual externa e interna','Inspeção da placa (soldas, trilhas, componentes dilatados ou queimados)','Verificação de fusíveis e proteções','Medição das tensões de alimentação e de saída da fonte','Medição de continuidade','Análise de componentes (em circuito / fora do circuito)','Teste funcional','Verificação de aquecimento anormal'],med:[['Tensão de entrada','V'],['Tensão de saída da fonte','V'],['Corrente de consumo','A'],['Continuidade',''],['Temperatura de componentes','°C']],refs:['nr10']},

const COLS=['empresa','profissionais','clientes','laudos','modelos','catalogo','instrumentos'];

let idb=null,idbOk=false;
function abrirDB(){return new Promise(res=>{try{const r=indexedDB.open('fenix_laudos',1);r.onupgradeneeded=()=>{COLS.forEach(c=>{if(!r.result.objectStoreNames.contains(c))r.result.createObjectStore(c,{keyPath:'id'})})};r.onsuccess=()=>{idb=r.result;idbOk=true;res()};r.onerror=()=>res();r.onblocked=()=>res()}catch(e){res()}})}
const tx=(c,m)=>idb.transaction(c,m).objectStore(c);
function carregar(){return Promise.all(COLS.map(c=>new Promise(res=>{if(!idbOk)return res();try{const q=tx(c,'readonly').getAll();q.onsuccess=()=>{S[c]=q.result||[];res()};q.onerror=()=>res()}catch(e){res()}})))}
function salvar(c,o){o.atualizadoEm=agora();o.sync=false;const i=S[c].findIndex(x=>x.id===o.id);if(i>=0)S[c][i]=o;else S[c].push(o);if(idbOk){try{tx(c,'readwrite').put(o)}catch(e){console.warn(e)}}return o}
function remover(c,id){S[c]=S[c].filter(x=>x.id!==id);if(idbOk){try{tx(c,'readwrite').delete(id)}catch(e){}}}
function limparTudo(){return Promise.all(COLS.map(c=>new Promise(res=>{S[c]=[];if(!idbOk)return res();try{const q=tx(c,'readwrite').clear();q.onsuccess=q.onerror=()=>res()}catch(e){res()}})))}

function campoHTML(c,v){
 const val=v[c.k]??'';let inp='';const full=c.w?' full':'';
 if(c.t==='textarea')inp=`<textarea data-k="${c.k}" rows="${c.rows||3}" placeholder="${esc(c.ph||'')}">${esc(val)}</textarea>`;
 else if(c.t==='select')inp=`<select data-k="${c.k}">${c.o.map(([a,b])=>`<option value="${esc(a)}"${a===val?' selected':''}>${esc(b)}</option>`).join('')}</select>`;
 else if(c.t==='cats')return `<div class="f full"><span class="lb">${esc(c.l)}</span>${allCats().map(k=>`<label class="chk"><input type="checkbox" data-cat="${k.id}"${(v[c.k]||[]).includes(k.id)?' checked':''}> ${esc(k.nome)}</label>`).join('')}${c.hint?`<small>${esc(c.hint)}</small>`:''}</div>`;
 else if(c.t==='img')return `<div class="f${full}"><span class="lb">${esc(c.l)}</span><div data-img="${c.k}">${val?`<img class="imgp" src="${val}" alt="">`:''}</div><input type="file" accept="image/*" data-file="${c.k}">${val?`<button class="btn sm danger" type="button" data-rmimg="${c.k}" style="margin-top:6px">Remover imagem</button>`:''}</div>`;
 else if(c.t==='sign')return `<div class="f full"><span class="lb">${esc(c.l)}</span><div data-img="${c.k}">${val?`<img class="imgp" src="${val}" alt="">`:'<small>Nenhuma assinatura cadastrada</small>'}</div><canvas class="sg" data-sg="${c.k}"></canvas><div class="acts"><button class="btn sm" type="button" data-sgclr="${c.k}">Limpar quadro</button><button class="btn sm" type="button" data-sgset="${c.k}">Usar o que desenhei</button><input type="file" accept="image/*" data-file="${c.k}" style="max-width:260px"></div><small>Desenhe com o dedo/mouse e toque em "Usar o que desenhei", ou envie uma imagem da assinatura. Assinatura visual não é assinatura digital certificada.</small></div>`;
 else if(c.t==='cnpj')return `<label class="f${full}"><span>${esc(c.l)}</span><div style="display:flex;gap:8px"><input data-k="${c.k}" value="${esc(val)}" inputmode="numeric" placeholder="${esc(c.ph||'')}"><button class="btn sm" type="button" data-buscacnpj>Buscar CNPJ</button></div>${c.hint?`<small>${esc(c.hint)}</small>`:''}</label>`;
 else inp=`<input data-k="${c.k}" type="${c.t||'text'}" value="${esc(val)}" placeholder="${esc(c.ph||'')}"${c.list?` list="${c.list}"`:''}>`;
 return `<label class="f${full}"><span>${esc(c.l)}</span>${inp}${c.hint?`<small>${esc(c.hint)}</small>`:''}</label>`}

function formModal(titulo,campos,val,onSave){

  const out={...v};
  $$('[data-k]',api.el).forEach(x=>out[x.dataset.k]=x.value.trim());
  const cs=campos.find(c=>c.t==='cats');if(cs)out[cs.k]=$$('[data-cat]',api.el).filter(x=>x.checked).map(x=>x.dataset.cat);
  const msg=await onSave(out);if(msg){toast(msg);return false}}}],
  onOpen:api=>{
   const el=api.el;
   el.addEventListener('change',async e=>{const f=e.target.dataset.file;if(f&&e.target.files[0]){try{v[f]=await lerImagem(e.target.files[0],f==='assinatura'?500:600,.9,true);$(`[data-img=${f}]`,el).innerHTML=`<img class="imgp" src="${v[f]}" alt="">`}catch(x){toast('Imagem inválida')}}});
   el.addEventListener('click',async e=>{
    const t=e.target;
    if(t.dataset.rmimg&&await confirmar('Tem certeza que quer remover esta imagem?',{ok:'Remover'})){v[t.dataset.rmimg]='';$(`[data-img=${t.dataset.rmimg}]`,el).innerHTML='';t.remove()}
    if(t.dataset.sgclr){const cv=$(`[data-sg=${t.dataset.sgclr}]`,el);cv.getContext('2d').clearRect(0,0,cv.width,cv.height);cv._d=0}
    if(t.dataset.sgset){const cv=$(`[data-sg=${t.dataset.sgset}]`,el);if(!cv._d){toast('Desenhe a assinatura primeiro');return}v[t.dataset.sgset]=cv.toDataURL('image/png');$(`[data-img=${t.dataset.sgset}]`,el).innerHTML=`<img class="imgp" src="${v[t.dataset.sgset]}" alt="">`;toast('Assinatura definida — toque em Salvar')}
    if(t.dataset.buscacnpj!==undefined){const inp=$('[data-k=cnpj],[data-k=doc]',el);const n=soNum(inp.value);if(!validarCNPJ(n)){toast('CNPJ inválido');return}
     t.disabled=true;t.textContent='Buscando…';
     try{const j=await buscarCNPJ(n);const S1=(ks,x)=>{for(const k of ks){const i=$(`[data-k=${k}]`,el);if(i&&x){i.value=x;return}}};
      S1(['razao','nome'],j.razao_social);S1(['fantasia'],j.nome_fantasia);S1(['logradouro'],[j.descricao_tipo_de_logradouro,j.logradouro].filter(Boolean).join(' '));S1(['numero'],j.numero);S1(['bairro'],j.bairro);S1(['cidade'],j.municipio);S1(['uf'],j.uf);S1(['cep'],j.cep);S1(['telefone'],j.ddd_telefone_1);S1(['email'],j.email);toast('Dados preenchidos pela Receita (BrasilAPI)')}
     catch(x){toast(navigator.onLine?x.message:'Sem internet: preencha manualmente')}
     t.disabled=false;t.textContent='Buscar CNPJ'}});
   $$('canvas.sg',el).forEach(cv=>{const r=cv.getBoundingClientRect();cv.width=Math.max(300,r.width*2);cv.height=300;const x=cv.getContext('2d');x.lineWidth=4;x.lineCap='round';x.strokeStyle='#111';let d=false;
    const pt=e=>{const b=cv.getBoundingClientRect();return[(e.clientX-b.left)*cv.width/b.width,(e.clientY-b.top)*cv.height/b.height]};
    cv.onpointerdown=e=>{d=true;cv.setPointerCapture(e.pointerId);const[a,b]=pt(e);x.beginPath();x.moveTo(a,b)};
    cv.onpointermove=e=>{if(!d)return;const[a,b]=pt(e);x.lineTo(a,b);x.stroke();cv._d=1};
    cv.onpointerup=cv.onpointercancel=()=>d=false})}});
 return m}
function lerImagem(file,max=1280,q=.78,png=false){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');if(!png){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}x.drawImage(im,0,0,c.width,c.height);res(c.toDataURL(png?'image/png':'image/jpeg',q))};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}

function carregarProc(msg=true){const cat=catPor(L.dados.categoriaId);if(!cat){toast('Escolha a categoria na etapa 1');return}const ex=new Set(L.dados.procedimentos.map(p=>p.nome));let n=0;cat.proc.forEach(p=>{if(!ex.has(p)){L.dados.procedimentos.push({nome:p,status:'pendente',resultado:'',data:''});n++}});if(n){agendar();msg&&recarregaStep()}else msg&&toast('Todos os procedimentos do modelo já estão na lista')}

function revisar(l){
 const d=l.dados,P=S.profissionais.find(p=>p.id===d.profissionalId),C=S.clientes.find(c=>c.id===d.clienteId),q=d.equip||{},cat=catPor(d.categoriaId),out=[];
 const B=(m,s)=>out.push({n:'bloq',m,s}),A=(m,s)=>out.push({n:'aviso',m,s}),vz=x=>!(x||'').toString().trim();
 if(!emp().razao)B('Empresa não cadastrada (cabeçalho institucional).',0);
 if(!P)B('Selecione o profissional responsável.',0);else{if(!P.conselho||!P.registro)B('Profissional sem conselho e/ou número de registro cadastrado.',0);if(cat&&!(P.cats||[]).includes(cat.id))B(`A categoria "${cat.nome}" não consta nas atribuições cadastradas do profissional. Confirme a atribuição junto ao conselho antes de emitir.`,0)}
 if(!C)B('Selecione o contratante.',0);
 if(!cat)B('Selecione a categoria do equipamento.',0);
 if(vz(d.local))B('Informe o local da inspeção.',0);
 if(!d.finalidadeSel||(d.finalidadeSel==='__outra'&&vz(d.finalidadeTxt)))B('Informe a finalidade do laudo.',0);
 if(vz(q.equipamento))B('Informe o equipamento.',1);
 if(vz(q.fabricante)||vz(q.modelo)||vz(q.serie))A('Fabricante, modelo ou número de série não informados.',1);
 if(!(d.fotosEquip||[]).length)A('Nenhuma fotografia do equipamento ou da placa de identificação.',1);
 if(vz(d.relato?.texto))A('Relato do contratante não preenchido.',2);
 const pr=d.procedimentos||[];if(!pr.length)B('Nenhum procedimento de inspeção registrado.',3);
 pr.forEach(p=>{if(!p.status||p.status==='pendente')B(`Procedimento sem situação (realizado, não realizado ou não aplicável): "${p.nome}".`,3);else if(p.status==='realizado'&&vz(p.resultado))B(`Procedimento realizado sem resultado: "${p.nome}".`,3)});
 const md=d.medicoes||[];
 md.forEach(m=>{const n=m.parametro||'(sem nome)';if(vz(m.resultado))B(`Medição "${n}" sem resultado.`,4);if((m.avaliacao==='conforme'||m.avaliacao==='nao')&&(vz(m.referencia)||vz(m.fonte)))B(`Medição "${n}": a avaliação exige referência e fonte do critério (fabricante, norma ou critério justificado).`,4);if(!m.avaliacao)A(`Medição "${n}" sem avaliação (será apresentada apenas como registro).`,4)});
 if(md.length&&!(d.instrumentos||[]).length)A('Há medições, mas nenhum instrumento foi registrado.',3);
 (d.instrumentos||[]).forEach(i=>{if(vz(i.nome))B('Instrumento sem nome.',3)});
 const cn=d.conclusao||{},nc=md.some(m=>m.avaliacao==='nao');
 if(vz(d.diag?.causa)===false&&vz(d.hipoteses)&&vz(d.constatacoes))A('Há causa provável, mas nenhuma constatação ou hipótese registrada que a sustente.',5);
 if(vz(d.constatacoes)&&vz(d.hipoteses)&&vz(d.diag?.defeito))A('Diagnóstico sem constatações, hipóteses ou defeito registrados.',5);
 if(!cn.classe)B('Selecione a classificação técnica da conclusão.',6);
 if(vz(cn.justificativa))B('Justifique a classificação técnica.',6);
 if((cn.classe==='apto'||cn.classe==='restricoes')&&nc)B('Incoerência: conclusão favorável com medição avaliada como não conforme.',6);
 if((cn.classe==='inapto'||cn.classe==='manutencao')&&!nc&&vz(d.constatacoes))A('Conclusão desfavorável sem constatação registrada nem medição não conforme.',6);
 if(vz(cn.recomendacoes))A('Recomendações técnicas não preenchidas.',6);
 const r=d.resp||{};
 if(!r.tipoReg)B('Informe o TRT/ART ou marque "não aplicável".',7);
 else if((r.tipoReg==='TRT'||r.tipoReg==='ART')&&vz(r.numReg))B(`Informe o número do ${r.tipoReg}.`,7);
 else if(r.tipoReg==='nenhum')A('Confirme que esta atividade dispensa TRT/ART.',7);
 if(vz(r.local))B('Informe o local de emissão.',7);
 if(!(r.refs||[]).length&&vz(r.refsExtra))A('Nenhuma referência técnica selecionada. Confira a aplicabilidade das normas.',7);
 if(d.assTipo==='visual'&&P&&!P.assinatura)A('Profissional sem imagem de assinatura cadastrada.',7);
 return out}

/* ===== prompt para IA (apoio à redação) ===== */
function promptIA(l){
 const d=l.dados,q=d.equip||{},cat=catPor(d.categoriaId),P=S.profissionais.find(p=>p.id===d.profissionalId)||{};
 const L1=(t,v)=>v?`- ${t}: ${String(v).replace(/\n/g,' / ')}`:null;
 const dados=[`EQUIPAMENTO`,L1('Categoria',cat?.nome),L1('Equipamento',q.equipamento),L1('Fabricante',q.fabricante),L1('Modelo',q.modelo),L1('Série',q.serie),L1('Tensão',q.tensao),L1('Frequência',q.frequencia),L1('Potência',q.potencia),
 `FINALIDADE`,L1('Finalidade',d.finalidadeSel==='__outra'?d.finalidadeTxt:[d.finalidadeSel,d.finalidadeTxt].filter(Boolean).join(' — ')),
 `RELATO DO CONTRATANTE (não é constatação)`,L1('Relato',d.relato?.texto),L1('Sintomas',d.relato?.sintomas),
 `PROCEDIMENTOS`,...(d.procedimentos||[]).map(p=>`- ${p.nome} → ${STP[p.status||'pendente']}${p.resultado?' — '+p.resultado:''}`),
 `INSTRUMENTOS`,...(d.instrumentos||[]).map(i=>`- ${[i.nome,i.fabricante,i.modelo,i.serie].filter(Boolean).join(' ')}`),
 `MEDIÇÕES`,...(d.medicoes||[]).map(m=>`- ${m.parametro}: ${[m.resultado,m.unidade].filter(Boolean).join(' ')} | referência: ${m.referencia||'não informada'} (${m.fonte||'sem fonte'}) | avaliação: ${(AVAL.find(a=>a[0]===m.avaliacao)||[,'não avaliada'])[1]}`),
 `CONSTATAÇÕES REGISTRADAS`,...linhas(d.constatacoes).map(x=>'- '+x),`HIPÓTESES REGISTRADAS`,...linhas(d.hipoteses).map(x=>'- '+x)].filter(Boolean).join('\n');
 return `Você é um assistente de documentação técnica para laudos de equipamentos eletroeletrônicos. Auxilie o profissional habilitado (${P.nome||'responsável técnico'}) na redação, sem substituir o julgamento técnico dele.

REGRAS PERMANENTES
1. Nunca invente medições, resultados ou informações do equipamento.
2. Nunca afirme que um teste foi realizado se não houver registro.
3. Nunca invente normas, artigos, resoluções ou referências técnicas.
4. Aponte informações ausentes ou contraditórias.
5. Diferencie relato do contratante, constatação, hipótese e recomendação.
6. Não emita diagnóstico conclusivo baseado apenas em suposições.
7. Não ultrapasse as atribuições do profissional responsável.
8. Apresente inconsistências antes de qualquer conclusão.
9. Use linguagem técnica, impessoal e objetiva, em português do Brasil.
10. Não conclua aprovação ou reprovação sem critérios técnicos definidos (fabricante, norma ou critério justificado).

TAREFA
Com base SOMENTE nos dados abaixo: (a) liste inconsistências e dados ausentes; (b) redija a seção "Diagnóstico e análise técnica" separando constatações de hipóteses; (c) sugira redação para "Conclusão e recomendações" sem inventar fatos. Ao final, lembre que a decisão é do profissional.

DADOS DO LAUDO ${l.numero}
${dados}`}

document.addEventListener('change',async e=>{const t=e.target;if(!L)return;
 if(t.dataset.foto&&!LOCK){for(const f of t.files){try{(L.dados[t.dataset.foto]=L.dados[t.dataset.foto]||[]).push({id:uid(),legenda:'',src:await lerImagem(f)})}catch(x){toast('Imagem inválida')}}agendar();recarregaStep();return}
 if(t.dataset.ref&&!LOCK){const r=L.dados.resp.refs=L.dados.resp.refs||[],i=r.indexOf(t.dataset.ref);if(t.checked){if(i<0)r.push(t.dataset.ref)}else if(i>=0)r.splice(i,1);agendar();return}
 if(t.dataset.p&&!LOCK)hooks(t.dataset.p)});

/* ===== rotas e inicialização ===== */
function rota(){
 const h=location.hash.replace(/^#\/?/,'').split('/'),v=h[0]||'home';
 if(v!=='laudo'&&L){gravar();L=null}
 if(v==='novo'){const l=criarLaudo(dadosVazios());return location.replace('#/laudo/'+l.id+'/0')}
 ({home:vHome,laudos:vLaudos,empresa:vEmpresa,profissionais:()=>vLista('profissionais'),clientes:()=>vLista('clientes'),catalogo:()=>vLista('catalogo'),modelos:vModelos,sync:vSync,laudo:()=>vEditor(h[1],h[2])}[v]||vHome)()}
function netBadge(){const n=$('#net');n.textContent=navigator.onLine?'Online':'Offline';n.className='badge '+(navigator.onLine?'ok':'off')}
document.addEventListener('visibilitychange',()=>{if(document.hidden)gravar()});
addEventListener('pagehide',gravar);addEventListener('online',netBadge);addEventListener('offline',netBadge);addEventListener('hashchange',rota);
(async()=>{await abrirDB();await carregar();try{navigator.storage?.persist?.()}catch(e){}
 if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
 netBadge();if(!idbOk)toast('Armazenamento local indisponível: os dados valem só nesta sessão');rota()})();

</script>
</body></html>
